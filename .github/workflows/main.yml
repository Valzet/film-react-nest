name: Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: vars
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/film-frontend:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/film-frontend:${{ steps.vars.outputs.short_sha }}

      - name: Push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/film-backend:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/film-backend:${{ steps.vars.outputs.short_sha }}

      - name: Push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/film-nginx:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/film-nginx:${{ steps.vars.outputs.short_sha }}
